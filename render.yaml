envVarGroups:
  - name: iara-shared-secrets
    envVars:
      - key: CRON_SECRET
        generateValue: true

services:
  - type: web
    name: iara-jewellery-web
    runtime: node
    plan: starter
    buildCommand: corepack enable && pnpm install --frozen-lockfile && DATABASE_URL=file:/tmp/iara-build.db pnpm db:setup && DATABASE_URL=file:/tmp/iara-build.db pnpm build
    startCommand: NODE_OPTIONS=--max-old-space-size=256 node scripts/apply-sqlite-migration.mjs && NODE_OPTIONS=--max-old-space-size=256 node --import tsx prisma/seed.ts && exec env NODE_OPTIONS=--max-old-space-size=256 node node_modules/next/dist/bin/next start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:/var/data/iara.db
      - key: MEDIA_ROOT
        value: /var/data/uploads
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - fromGroup: iara-shared-secrets
    disk:
      name: iara-data
      mountPath: /var/data
      sizeGB: 10
  - type: cron
    name: iara-release-reservations
    runtime: node
    schedule: "*/5 * * * *"
    buildCommand: echo ready
    startCommand: 'curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/release-reservations"'
    envVars:
      - key: APP_URL
        sync: false
      - fromGroup: iara-shared-secrets
